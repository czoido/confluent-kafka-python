[build-system]
requires = ["conan-py-build"]
build-backend = "conan_py_build.build"

[project]
name = "confluent-kafka"
version = "2.14.2"
description = "Confluent's Python client for Apache Kafka"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules"]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "typing-extensions; python_version < '3.11'",
]

[project.optional-dependencies]
schemaregistry = [
    "attrs>=21.2.0",
    "cachetools>=5.5.0",
    "certifi",
    "httpx>=0.26",
    "authlib>=1.0.0",
]
schema_registry = [
    "attrs>=21.2.0",
    "cachetools>=5.5.0",
    "certifi",
    "httpx>=0.26",
    "authlib>=1.0.0",
]
avro = [
    "fastavro>=1.5.4,<1.8.0; python_version == '3.7'",
    "fastavro>=1.5.4,<2; python_version > '3.7'",
    "requests",
    "avro>=1.11.1,<2",
    "attrs>=21.2.0",
    "cachetools>=5.5.0",
    "certifi",
    "httpx>=0.26",
    "authlib>=1.0.0",
]
json = [
    "pyrsistent",
    "jsonschema>=4.18.0",
    "orjson>=3.10",
    "attrs>=21.2.0",
    "cachetools>=5.5.0",
    "certifi",
    "httpx>=0.26",
    "authlib>=1.0.0",
]
protobuf = [
    "googleapis-common-protos",
    "protobuf",
    "attrs>=21.2.0",
    "cachetools>=5.5.0",
    "certifi",
    "httpx>=0.26",
    "authlib>=1.0.0",
]
rules = [
    "azure-identity",
    "azure-keyvault-keys",
    "boto3>=1.35",
    "cel-python>=0.4.0",
    "google-re2<1.1.20251105",
    "google-auth",
    "google-api-core",
    "google-cloud-kms",
    "hkdf==0.0.3",
    "hvac",
    "jsonata-python",
    "pyyaml>=6.0.0",
    "tink",
    "attrs>=21.2.0",
    "cachetools>=5.5.0",
    "certifi",
    "httpx>=0.26",
    "authlib>=1.0.0",
]
tests = [
    "urllib3<3",
    "flake8",
    "mypy",
    "attrs",
    "types-cachetools",
    "types-requests",
    "orjson",
    "pytest",
    "pytest-timeout",
    "requests-mock",
    "respx",
    "pytest_cov",
    "pluggy<1.6.0",
    "pytest-asyncio",
    "async-timeout",
    "black>=24.0.0",
    "isort>=5.13.0",
    "attrs>=21.2.0",
    "cachetools>=5.5.0",
    "certifi",
    "httpx>=0.26",
    "authlib>=1.0.0",
]
docs = [
    "sphinx",
    "sphinx-rtd-theme",
    "tomli; python_version < '3.11'",
    "attrs>=21.2.0",
    "cachetools>=5.5.0",
    "certifi",
    "httpx>=0.26",
    "authlib>=1.0.0",
]
soaktest = [
    "psutil",
    "opentelemetry-distro",
    "opentelemetry-exporter-otlp",
]
dev = [
    "urllib3<3",
    "flake8",
    "mypy",
    "attrs",
    "types-cachetools",
    "types-requests",
    "orjson",
    "pytest",
    "pytest-timeout",
    "requests-mock",
    "respx",
    "pytest_cov",
    "pluggy<1.6.0",
    "pytest-asyncio",
    "async-timeout",
    "black>=24.0.0",
    "isort>=5.13.0",
    "sphinx",
    "sphinx-rtd-theme",
    "tomli; python_version < '3.11'",
    "fastavro>=1.5.4,<2; python_version > '3.7'",
    "requests",
    "avro>=1.11.1,<2",
    "pyrsistent",
    "jsonschema>=4.18.0",
    "googleapis-common-protos",
    "protobuf",
    "attrs>=21.2.0",
    "cachetools>=5.5.0",
    "certifi",
    "httpx>=0.26",
    "authlib>=1.0.0",
]

[[project.authors]]
name = "Confluent Inc."
email = "support@confluent.io"

[project.urls]
Homepage = "https://github.com/confluentinc/confluent-kafka-python"

[tool.mypy]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "confluent_kafka.schema_registry.avro",
    "confluent_kafka.schema_registry.json_schema",
    "confluent_kafka.schema_registry.protobuf",
]
disable_error_code = ["assignment", "no-redef"]

[[tool.mypy.overrides]]
module = [
    "confluent_kafka.schema_registry.confluent.meta_pb2",
    "confluent_kafka.schema_registry.confluent.types.decimal_pb2",
]
ignore_errors = true

[tool.black]
line-length = 120
target-version = ['py38', 'py39', 'py310', 'py311', 'py312', 'py313']
skip-string-normalization = true
include = '\.pyi?$'
extend-exclude = '''
/(
  # Exclude build directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | _build
  | buck-out
  | build
  | dist
  | tmp-build
  | tmp-KafkaCluster
  # Exclude generated files
  | .*_pb2\.py
  # Exclude docs config (maintained separately)
  | docs/conf\.py
)/
'''

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip = [
    ".formatignore",
    ".git",
    ".venv",
    "venv",
    "build",
    "dist",
    "tmp-build",
    "tmp-KafkaCluster",
    ".tox",
]
skip_glob = [
    "*_pb2.py",
    "docs/conf.py",
]
known_first_party = ["confluent_kafka"]

[tool.conan-py-build]
extra-arguments = [
    "-o=librdkafka/*:shared=True",
    "-o=librdkafka/*:ssl=True",
    "-o=librdkafka/*:zlib=True",
    "-o=librdkafka/*:zstd=True",
]

[tool.conan-py-build.wheel]
packages = ["src/confluent_kafka"]

[tool.conan-py-build.sdist]
exclude = [".semaphore", ".github/workflows"]

[tool.cibuildwheel]
build = "cp38-* cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = ["*-musllinux*", "*-manylinux_i686", "*-win32"]
test-requires = ["pytest"]
test-command = "pytest {project}/tests/test_wheel.py -v"

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
repair-wheel-command = "auditwheel repair -w {dest_dir} {wheel}"

[tool.cibuildwheel.macos]
archs = ["arm64", "x86_64"]
# Clear Python3_ROOT_DIR set by actions/setup-python so CMake finds the right per-version interpreter.
# Deployment target and arch are controlled by profiles/macos-cross.jinja via ARCHFLAGS.
environment = { Python3_ROOT_DIR = "", Python_ROOT_DIR = "", Python2_ROOT_DIR = "" }
repair-wheel-command = "delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}"
config-settings = {"host-profile" = "profiles/macos-cross.jinja"}

[tool.cibuildwheel.windows]
before-all = "pip install delvewheel"
environment = { Python3_ROOT_DIR = "", Python_ROOT_DIR = "", Python2_ROOT_DIR = "" }
repair-wheel-command = 'delvewheel repair --add-path "build/.conan-libs" -w "{dest_dir}" "{wheel}"'

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Exclude ducktape tests from pytest collection to avoid import errors in CI
# Ducktape requires boto3==1.33.13 and PyYAML==5.3.1, but project requires boto3>=1.35 and PyYAML>=6.0.0
# TODO: Remove this exclusion when ducktape updates to support newer dependency versions
norecursedirs = "tests/ducktape"
